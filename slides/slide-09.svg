<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0"><rect x="0" y="0" width="1280.0" height="720.0" fill="#182636"/><rect x="62.4" y="53.8" width="1153.9" height="120.0" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="0"><text x="68.8" y="104.2" text-anchor="start"><tspan style="font-weight:bold;font-size:36.0px;font-family:'Aptos Display','Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">Arata bine. Dar ne putem baza pe ea?</tspan></text></g><rect x="62.4" y="668.2" width="1152.0" height="1.2" fill="#8190A2" stroke="none" stroke-width="0.00"/><g data-shape-text="1"></g><rect x="62.4" y="679.7" width="1056.0" height="24.8" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="2"><text x="68.8" y="694.1" text-anchor="start"><tspan style="font-size:9.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#CDD6E1;">CARTEA DALIEI  /  CUM A AJUNS AI ATAT DE CAPABIL SI CE POTI FACE TU CU EL?</tspan></text></g><rect x="1158.7" y="673.9" width="57.6" height="31.5" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="3"><text x="1165.1" y="695.0" text-anchor="start"><tspan style="font-weight:bold;font-size:14.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">9</tspan></text></g><rect x="81.6" y="203.5" width="398.4" height="62.4" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="4"><text x="88.0" y="241.9" text-anchor="start"><tspan style="font-weight:bold;font-size:27.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#D6EC79;">Respecta cererea?</tspan></text></g><rect x="504.0" y="203.5" width="681.6" height="92.2" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="5"><text x="510.4" y="239.3" text-anchor="start"><tspan style="font-size:25.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">Data, ora, locul si accesul sunt cele stabilite.</tspan></text></g><rect x="81.6" y="333.1" width="398.4" height="62.4" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="6"><text x="88.0" y="371.5" text-anchor="start"><tspan style="font-weight:bold;font-size:27.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#D6EC79;">Functioneaza?</tspan></text></g><rect x="504.0" y="333.1" width="681.6" height="92.2" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="7"><text x="510.4" y="368.9" text-anchor="start"><tspan style="font-size:25.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">Butonul ajunge la program. Textul incape pe telefon.</tspan></text></g><rect x="81.6" y="462.7" width="398.4" height="62.4" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="8"><text x="88.0" y="501.1" text-anchor="start"><tspan style="font-weight:bold;font-size:27.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#D6EC79;">Informatiile sunt adevarate?</tspan></text></g><rect x="504.0" y="462.7" width="681.6" height="92.2" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="9"><text x="510.4" y="498.5" text-anchor="start"><tspan style="font-size:25.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">Pentru un eveniment real, le confirmam cu </tspan></text><text x="510.4" y="531.8" text-anchor="start"><tspan style="font-size:25.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">organizatorul.</tspan></text></g></svg>