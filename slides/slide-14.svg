<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0"><rect x="0" y="0" width="1280.0" height="720.0" fill="#182636"/><rect x="62.4" y="53.8" width="1153.9" height="120.0" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="0"><text x="68.8" y="104.2" text-anchor="start"><tspan style="font-weight:bold;font-size:36.0px;font-family:'Aptos Display','Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">AI poate mult. Intrebarile raman ale tale.</tspan></text></g><rect x="62.4" y="668.2" width="1152.0" height="1.2" fill="#8190A2" stroke="none" stroke-width="0.00"/><g data-shape-text="1"></g><rect x="62.4" y="679.7" width="1056.0" height="24.8" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="2"><text x="68.8" y="694.1" text-anchor="start"><tspan style="font-size:9.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#CDD6E1;">CARTEA DALIEI  /  CUM A AJUNS AI ATAT DE CAPABIL SI CE POTI FACE TU CU EL?</tspan></text></g><rect x="1158.7" y="673.9" width="57.6" height="31.5" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="3"><text x="1165.1" y="695.0" text-anchor="start"><tspan style="font-weight:bold;font-size:14.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">14</tspan></text></g><rect x="81.6" y="201.6" width="489.6" height="64.3" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="4"><text x="88.0" y="242.7" text-anchor="start"><tspan style="font-weight:bold;font-size:29.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#D6EC79;">Un instrument puternic.</tspan></text></g><rect x="600.0" y="201.6" width="585.6" height="81.6" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="5"><text x="606.4" y="238.7" text-anchor="start"><tspan style="font-size:26.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">Poate ajuta mult. Poate si gresi.</tspan></text></g><rect x="81.6" y="314.9" width="489.6" height="64.3" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="6"><text x="88.0" y="355.9" text-anchor="start"><tspan style="font-weight:bold;font-size:29.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#D6EC79;">Tu aduci valoare.</tspan></text></g><rect x="600.0" y="314.9" width="585.6" height="81.6" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="7"><text x="606.4" y="351.9" text-anchor="start"><tspan style="font-size:26.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">Prin intrebari, alegeri si gandire.</tspan></text></g><rect x="81.6" y="428.2" width="489.6" height="64.3" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="8"><text x="88.0" y="469.2" text-anchor="start"><tspan style="font-weight:bold;font-size:29.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#D6EC79;">Poti incepe de acum.</tspan></text></g><rect x="600.0" y="428.2" width="585.6" height="81.6" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="9"><text x="606.4" y="465.2" text-anchor="start"><tspan style="font-size:26.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">Nu trebuie sa stii deja totul.</tspan></text></g><rect x="81.6" y="587.5" width="1094.4" height="49.9" fill="none" stroke="none" stroke-width="0.00"/><g data-shape-text="10"><text x="88.0" y="624.6" text-anchor="start"><tspan style="font-weight:bold;font-size:26.0px;font-family:Aptos,'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#FFFFFF;">Ce ai vrea sa creezi? Ce ai verifica prima data?</tspan></text></g></svg>